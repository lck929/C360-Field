name: c360
description: C360 Field, face-verified site attendance for construction technicians.
publish_to: 'none'
version: 1.0.0+100

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^3.5.0
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  go_router: ^18.1.4
  intl: ^0.20.3
  permission_handler: ^13.0.2
  path_provider: ^2.1.6
  uuid: ^4.6.0
  connectivity_plus: ^7.3.2
  network_info_plus: ^8.2.2
  camera: ^0.12.2
  google_mlkit_face_detection: ^1.0.2
  flutter_image_compress: ^2.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
